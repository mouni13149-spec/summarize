[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-document-summarizer"
version = "0.1.0"
description = "Summarize long documents with a local baseline, Streamlit app, and optional BART fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
app = [
  "pypdf>=4.2.0",
  "streamlit>=1.35.0"
]
ml = [
  "accelerate>=0.30.0",
  "datasets>=2.19.0",
  "evaluate>=0.4.2",
  "rouge-score>=0.1.2",
  "torch>=2.2.0",
  "transformers>=4.41.0"
]

[project.scripts]
document-summarizer = "document_summarizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

